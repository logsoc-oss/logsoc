# LogSOC nginx load balancer config
# Place in /etc/nginx/conf.d/logsoc-lb.conf on Hestia
# Load-balances between 2 API instances (ports 8000 + 8001)

upstream logsoc_api_backend {
    server 127.0.0.1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=30s backup;
    keepalive 32;
}

server {
    listen 80;
    server_name logsoc.anytimeadmin.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name logsoc.anytimeadmin.info;

    # SSL certs managed by Hestia
    ssl_certificate /etc/letsencrypt/live/logsoc.anytimeadmin.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logsoc.anytimeadmin.info/privkey.pem;

    # Frontend (static files)
    root /home/anytimeadmin/web/logsoc.anytimeadmin.info/public_html;
    index index.html;

    # API proxy with load balancing
    location /api/ {
        proxy_pass http://logsoc_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://logsoc_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
}